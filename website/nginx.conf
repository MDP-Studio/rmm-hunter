server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($host = rmm-hunter.mdpstudio.com.au) {
    return 301 https://rmmhunter.mdpstudio.com.au$request_uri;
  }

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /sitemap.xml {
    try_files $uri =404;
  }

  location = /robots.txt {
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 7d;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
