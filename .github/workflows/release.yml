name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer and portable app
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          pip-audit -r requirements-build.txt

      - name: Clean release folders
        run: npm run clean

      - name: Test
        run: npm run check

      - name: Build scanner executable
        run: npm run build:scanner

      - name: Package Windows app
        id: package_windows
        shell: pwsh
        continue-on-error: true
        run: |
          npm.cmd run package:windows *> package-windows.log
          $code = $LASTEXITCODE
          Get-Content -Path package-windows.log -Tail 120
          exit $code

      - name: Upload package log
        if: steps.package_windows.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-log-${{ github.run_number }}
          path: package-windows.log
          if-no-files-found: ignore

      - name: Show packaging failure
        if: steps.package_windows.outcome == 'failure'
        shell: pwsh
        run: |
          $tail = (Get-Content -Path package-windows.log -Tail 40) -join "%0A"
          Write-Output "::error title=Electron Builder failed::$tail"
          exit 1

      - name: Resolve release signing mode
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { $missing += "SIGNPATH_API_TOKEN" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) { $missing += "SIGNPATH_ORGANIZATION_ID" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG)) { $missing += "SIGNPATH_PROJECT_SLUG" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG)) { $missing += "SIGNPATH_SIGNING_POLICY_SLUG" }

          if ($missing.Count -eq 0) {
            "mode=signpath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "SignPath signing is configured. Signed artifacts are required."
          } else {
            "mode=unsigned-beta" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "SignPath signing is not configured. Building unsigned beta artifacts. Missing: $($missing -join ', ')"
          }

      - name: Upload unsigned executables for SignPath
        id: upload_unsigned_signpath
        if: steps.signing.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: rmm-hunter-unsigned-signpath-${{ github.run_id }}
          path: |
            release/RMM-Hunter-Setup-*.exe
            release/RMM-Hunter-Portable-*.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: steps.signing.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-release

      - name: Replace unsigned executables with SignPath output
        if: steps.signing.outputs.mode == 'signpath'
        shell: pwsh
        run: |
          $signedRoot = Resolve-Path -LiteralPath signed-release
          $expected = @(
            Get-ChildItem -Path release -File -Filter "RMM-Hunter-Setup-*.exe"
            Get-ChildItem -Path release -File -Filter "RMM-Hunter-Portable-*.exe"
          )
          foreach ($target in $expected) {
            $matches = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter $target.Name)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one signed $($target.Name) from SignPath; found $($matches.Count)."
            }
            Copy-Item -LiteralPath $matches[0].FullName -Destination $target.FullName -Force
            Write-Host "Replaced $($target.Name) with signed artifact."
          }

      - name: Refresh update metadata after signing decision
        shell: pwsh
        run: .\scripts\refresh-update-metadata.ps1 -ReleaseDir release

      - name: Generate release verification files
        shell: pwsh
        run: |
          .\scripts\generate-release-manifest.ps1 `
            -ReleaseDir release `
            -SourceRef "${{ github.ref_name }}" `
            -SourceSha "${{ github.sha }}" `
            -Repository "${{ github.repository }}" `
            -RunId "${{ github.run_id }}" `
            -RunUrl "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            -SigningMode "${{ steps.signing.outputs.mode }}"

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $requireSigned = "${{ steps.signing.outputs.mode }}" -eq "signpath"
          .\scripts\verify-release-artifacts.ps1 -ReleaseDir release -RequireSigned:$requireSigned

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rmm-hunter-windows-${{ github.ref_name || github.run_number }}
          path: |
            release/RMM-Hunter-Setup-*.exe
            release/RMM-Hunter-Setup-*.exe.blockmap
            release/latest.yml
            release/RMM-Hunter-Portable-*.exe
            release/SHA256SUMS.txt
            release/rmm-hunter-release-manifest.json
            release/VERIFY_RELEASE.md
          if-no-files-found: error

  draft-release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: rmm-hunter-windows-${{ github.ref_name || github.run_number }}
          path: release

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            Get-ChildItem -Path release -File -Filter "RMM-Hunter-Setup-*.exe"
            Get-ChildItem -Path release -File -Filter "RMM-Hunter-Setup-*.exe.blockmap"
            Get-ChildItem -Path release -File -Filter "latest.yml"
            Get-ChildItem -Path release -File -Filter "RMM-Hunter-Portable-*.exe"
            Get-ChildItem -Path release -File -Filter "SHA256SUMS.txt"
            Get-ChildItem -Path release -File -Filter "rmm-hunter-release-manifest.json"
            Get-ChildItem -Path release -File -Filter "VERIFY_RELEASE.md"
          ) | Select-Object -ExpandProperty FullName

          $existingReleaseJson = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $existingReleaseJson | ConvertFrom-Json
            if (-not $existingRelease.isDraft) {
              $expectedNames = @($files | ForEach-Object { Split-Path -Path $_ -Leaf })
              $actualNames = @($existingRelease.assets | ForEach-Object { $_.name })
              $missingNames = @($expectedNames | Where-Object { $_ -notin $actualNames })
              if ($missingNames.Count -gt 0) {
                $missingList = $missingNames -join ", "
                throw "Release $tag already exists and is not a draft, but is missing expected asset(s): $missingList. Refusing to overwrite published assets."
              }
              Write-Host "Release $tag is already published with all expected assets. Leaving published assets unchanged."
              return
            }
            gh release upload $tag @files --clobber
            gh release edit $tag --title "RMM Hunter $tag"
          } else {
            gh release create $tag @files --draft --generate-notes --title "RMM Hunter $tag"
          }
